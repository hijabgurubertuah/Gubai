name: Build GubAI APK & Publish Page

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build APK & Prepare Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Keystore
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Memulihkan debug.keystore dari debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            echo "Membuat debug.keystore baru jika belum tersedia..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Prepare Output Files
        run: |
          mkdir -p public
          mkdir -p public/app/src/main/res/mipmap-hdpi
          cp app/build/outputs/apk/debug/app-debug.apk public/GubAI.apk
          cp index.html public/index.html
          if [ -f "app/src/main/res/mipmap-hdpi/ic_launcher.png" ]; then
            cp app/src/main/res/mipmap-hdpi/ic_launcher.png public/app/src/main/res/mipmap-hdpi/ic_launcher.png
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GubAI-apk
          path: public/GubAI.apk
          retention-days: 30

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest
          name: "GubAI - Rilis Terbaru (Siap Pasang)"
          body: "Unduh berkas `GubAI.apk` di bawah dan pasang langsung di perangkat Android Anda."
          files: public/GubAI.apk
          prerelease: false
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-pages:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
