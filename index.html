<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GubAI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #FAFAFA;
      color: #18181B;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px 100px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .app-icon {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      background: linear-gradient(135deg, #14B8A6, #0F766E);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(15, 118, 110, 0.2);
    }

    .app-icon svg {
      width: 52px;
      height: 52px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #0F766E;
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 14px;
      color: #71717A;
      margin-bottom: 32px;
    }

    .features {
      background: #FFFFFF;
      border: 1px solid #E4E4E7;
      border-radius: 16px;
      padding: 20px;
      text-align: left;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .feature-item {
      display: flex;
      align-items: center;
      font-size: 13.5px;
      font-weight: 500;
      color: #3F3F46;
      padding: 10px 0;
      border-bottom: 1px solid #F4F4F5;
    }

    .feature-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .feature-item:first-child {
      padding-top: 0;
    }

    .feature-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #14B8A6;
      margin-right: 12px;
      flex-shrink: 0;
    }

    /* Minimalist Floating Action Button */
    .floating-bar {
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 1000;
      padding: 0 16px;
      pointer-events: none;
    }

    .btn-download {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #0F766E;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.8px;
      padding: 16px 36px;
      border-radius: 40px;
      box-shadow: 0 8px 24px rgba(15, 118, 110, 0.35);
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
      text-transform: uppercase;
    }

    .btn-download:hover {
      background: #115E59;
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(15, 118, 110, 0.45);
    }

    .btn-download:active {
      transform: scale(0.98);
    }

    .btn-download svg {
      width: 18px;
      height: 18px;
      margin-right: 10px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="app-icon">
      <svg viewBox="0 0 108 108" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M65 46L59.5 47.5C58 44 55 42.5 51.5 42.5C45 42.5 40.5 47.5 40.5 54C40.5 60.5 45 65.5 51.5 65.5C56.5 65.5 59.5 62.5 60 58H51V52H67V61C64 67 59 71 51.5 71C41.5 71 34 63.5 34 54C34 44.5 41.5 37 51.5 37C58.5 37 63.5 40.8 65 46Z" fill="white"/>
        <path d="M73 29C73.3 32.2 74.8 33.7 78 34C74.8 34.3 73.3 35.8 73 39C72.7 35.8 71.2 34.3 68 34C71.2 33.7 72.7 32.2 73 29Z" fill="white"/>
      </svg>
    </div>

    <h1>GubAI</h1>
    <p class="subtitle">Multi Browser Kiosk Android Native</p>

    <div class="features">
      <div class="feature-item">
        <div class="feature-dot"></div>
        <span>Mode Mobile & Desktop Windows</span>
      </div>
      <div class="feature-item">
        <div class="feature-dot"></div>
        <span>Sesi Aktif di Latar Belakang</span>
      </div>
      <div class="feature-item">
        <div class="feature-dot"></div>
        <span>Profil Browser Terisolasi Mandiri</span>
      </div>
      <div class="feature-item">
        <div class="feature-dot"></div>
        <span>Kiosk Layar Penuh Imersif</span>
      </div>
    </div>
  </div>

  <!-- Tombol Melayang Minimalis Huruf Kapital -->
  <div class="floating-bar">
    <a id="downloadButton" href="GubAI.apk" class="btn-download" onclick="handleDownload(event)">
      <svg viewBox="0 0 24 24">
        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
      </svg>
      UNDUH APLIKASI
    </a>
  </div>

  <script>
    function getDownloadTarget() {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const hostname = window.location.hostname;

      if (hostname.endsWith('github.io') && pathParts.length > 0) {
        const owner = hostname.split('.')[0];
        const repo = pathParts[0];
        return `https://github.com/${owner}/${repo}/releases/latest/download/GubAI.apk`;
      }
      return 'GubAI.apk';
    }

    function handleDownload(event) {
      event.preventDefault();
      const targetUrl = getDownloadTarget();
      const btn = document.getElementById('downloadButton');
      btn.innerText = 'MENGUNDUH...';

      const link = document.createElement('a');
      link.href = targetUrl;
      link.download = 'GubAI.apk';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      setTimeout(() => {
        btn.innerHTML = `
          <svg viewBox="0 0 24 24" style="width:18px;height:18px;margin-right:10px;fill:currentColor">
            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
          </svg>
          UNDUH APLIKASI
        `;
      }, 2500);
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('downloadButton').href = getDownloadTarget();
    });
  </script>
</body>
</html>
